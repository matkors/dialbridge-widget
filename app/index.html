<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DialBridge Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#20251f;--ink2:#3d443a;--mute:#666d60;--faint:#8d9386;--line:#e2e4dc;--line2:#eeefe9;--acc:#f35427;--acc-d:#c43d17;--acc-t:#fdeee8;--ok:#2f7a45;--ok-t:#e7f3ea;--warn:#a15c00;--warn-t:#fdf3e1;--bad:#b3261e;--bad-t:#fbe9e7;--info:#2e5ea8;--info-t:#e8eef9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.lucide{width:17px;height:17px;stroke-width:1.9;flex-shrink:0}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100%}
/* sidebar */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:1px solid var(--line);background:#fbfbf8}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 14px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand span{font-size:11px;font-weight:700;color:var(--mute);padding:2px 6px;border:1px solid var(--line);border-radius:4px;letter-spacing:.04em;text-transform:uppercase}
.who{display:flex;flex-direction:column;gap:2px;margin:0 0 10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.who b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--mute)}
.who select{margin-top:6px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px}
.nav a:hover{background:#efefea}
.nav a.on{background:#e9eae3;color:var(--ink)}
.nav .cnt{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;text-align:center;line-height:19px}
.nav .lbl{padding:14px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);padding:8px}
.side .foot button{all:unset;cursor:pointer;color:var(--mute);text-decoration:underline}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.asbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 24px;background:var(--ink);color:#f1f2ea;font-size:13px}
.asbar a{color:#fff;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px 14px;flex-wrap:wrap}
.top h1{margin:0;font-size:21px;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.content{padding:0 24px 32px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.card > h2{margin:0;padding:14px 16px;border-bottom:1px solid var(--line2);font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card > h2 small{font-weight:500;color:var(--mute);font-size:12.5px}
.pad{padding:16px}
/* buttons + pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#c9ccc0}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:var(--acc-d)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:var(--acc-t);color:var(--acc-d)}
.s-contacted{background:var(--info-t);color:var(--info)}
.s-scheduled{background:var(--warn-t);color:var(--warn)}
.s-won{background:var(--ok-t);color:var(--ok)}
.s-lost{background:#eeefe9;color:var(--mute)}
.s-Active{background:var(--ok-t);color:var(--ok)}
.s-Pilot{background:var(--info-t);color:var(--info)}
.s-Onboarding{background:var(--warn-t);color:var(--warn)}
.s-Paused{background:#eeefe9;color:var(--mute)}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--ink2);background:#fff}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi span{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.kpi b{display:block;margin-top:4px;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi em{display:block;margin-top:2px;font-style:normal;font-size:12.5px;color:var(--mute)}
.kpi em.good{color:var(--ok)}
.kpi em.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{padding:9px 12px;text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fafaf7}
.tbl .num{text-align:right}
.tbl .sub{display:block;font-size:12.5px;color:var(--mute)}
.scroll{overflow-x:auto}
.bar{height:6px;border-radius:3px;background:#ecede6;overflow:hidden;width:90px}
.bar i{display:block;height:100%;background:var(--ok)}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border-radius:6px;font-size:13px}
.flag svg{margin-top:1px}
.flag.warn{background:var(--warn-t);color:#6e4100}
.flag.bad{background:var(--bad-t);color:#7d1b14}
.flag.ok{background:var(--ok-t);color:#1f5530}
/* inbox */
.inbox{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:0;min-height:600px;overflow:hidden}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.filters{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.filters button{border:0;background:none;padding:5px 9px;border-radius:5px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer}
.filters button.on{background:#e9eae3;color:var(--ink)}
.search{padding:10px;border-bottom:1px solid var(--line2)}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.items{overflow-y:auto;max-height:640px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;text-decoration:none}
.it:hover{background:#fafaf7}
.it.on{background:#f1f2ec;box-shadow:inset 3px 0 0 var(--ink)}
.it b{font-size:14px}
.it .t{font-size:12px;color:var(--mute);text-align:right}
.it .d{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .wait{color:var(--acc-d);font-weight:700}
.unread b::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--acc);vertical-align:1px}
.detail{min-width:0;display:flex;flex-direction:column}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.dh h3{margin:0;font-size:18px}
.dh p{margin:3px 0 0;color:var(--mute);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line2);border-bottom:1px solid var(--line2)}
.facts div{background:#fff;padding:11px 18px}
.facts dt{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:3px 0 0;font-weight:600}
.dbody{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.quote{margin:0;padding:10px 12px;border-left:3px solid var(--line);background:#fafaf7;border-radius:0 6px 6px 0;color:var(--ink2)}
.photos{display:flex;gap:8px}
.photos span{width:64px;height:64px;border-radius:6px;background:#ecede6 repeating-linear-gradient(45deg,#e4e5dd 0 6px,#ecede6 6px 12px);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.compose{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.compose .tpls{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line2);background:#fafaf7}
.compose .tpls button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.compose textarea{width:100%;border:0;padding:10px 12px;resize:vertical;min-height:72px;font-size:14px}
.compose textarea:focus{outline:none}
.compose .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line2)}
.compose .row span{font-size:12px;color:var(--mute)}
.outcome{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.outcome input,.outcome select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.outcome input{width:110px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.tl li span{color:var(--mute);font-variant-numeric:tabular-nums}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
/* chart */
.chart{padding:12px 16px 14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;padding:0 16px 14px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* forms */
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.fld{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:500;font-size:14px}
.fld small{font-weight:500;color:var(--mute);font-size:12px}
.svc-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.svc-row:last-child{border-bottom:0}
.price-row{display:grid;grid-template-columns:1fr 86px 86px;gap:8px;align-items:center;padding:5px 0}
.price-row input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;width:100%;text-align:right}
.preview{height:700px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.preview iframe{width:100%;height:100%;border:0}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:17px;height:17px;accent-color:var(--ok)}
.check.done span{color:var(--mute);text-decoration:line-through}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
pre{margin:0;padding:12px;border-radius:6px;background:#20251f;color:#e9eae3;white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 16px;border-radius:8px;background:var(--ink);color:#fff;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .box{width:100%;max-width:420px;padding:28px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-size:22px;letter-spacing:-.02em}
.login p{margin:0;color:var(--mute)}
.login .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;cursor:pointer}
.login .opt:hover{border-color:var(--ink)}
.login .opt b{display:block}
.login .opt span{font-size:12.5px;color:var(--mute)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 4px}.who,.nav .lbl,.side .foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}
  .top,.content{padding-left:16px;padding-right:16px}
  .inbox{grid-template-columns:1fr}
  [data-mobile-back]{display:inline-flex!important}
  .inbox.has-sel .list{display:none}
  .inbox:not(.has-sel) .detail{display:none}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../templates.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
