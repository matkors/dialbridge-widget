<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Only our own scripts and the pinned icon library run here; requests go only to our API (and the local workbench).
     GitHub Pages can't send headers, so the policy lives in the page. Every site may still frame it (that's the widget). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/lucide@0.453.0/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https://dialbridge-booking-api.dialbridge-booking-api.workers.dev http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Book online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#0E6650;--on-brand:#fff;--ink:#1a1d21;--mute:#5d646d;--faint:#8b929b;--line:#e1e4e8;--line2:#eef0f2;--soft:#f6f7f8;--ok:#1f8a4c;--warn:#a6291b;--warn-bg:#fdf0ee;--tint:color-mix(in srgb,var(--brand) 7%,#fff);--tint2:color-mix(in srgb,var(--brand) 22%,#fff);--ring:color-mix(in srgb,var(--brand) 22%,transparent);--hover-line:#c3c8ce;
  --ease:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.65,0,.35,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --sh-1:0 1px 2px rgba(16,24,40,.05);--sh-2:0 1px 2px rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.07);--sh-3:0 1px 2px rgba(16,24,40,.05),0 16px 40px rgba(16,24,40,.12)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Figtree,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:#eef0f2;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.embed{background:#fff}
.demo-lock .bd,.demo-lock{scrollbar-width:none;overscroll-behavior:none}
.demo-lock .bd::-webkit-scrollbar{display:none}
button,input,textarea{font-family:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.page{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:32px 16px}
.hostline{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:16px;text-align:center}
.hostline b{font-size:19px}
.hostline span{font-size:13.5px;color:var(--mute)}
.hostline a{color:inherit}
body.embed .page{padding:0;height:100%}
body.embed .hostline{display:none}
.card{width:100%;max-width:960px;height:min(720px,calc(100dvh - 120px));min-height:540px;display:flex;flex-direction:column;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh-3);animation:cardIn .5s var(--ease) both}
body.embed .card{max-width:none;height:100%;min-height:0;border-radius:0;box-shadow:none;animation:none}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}}
/* header */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px 15px 20px;background:var(--brand);color:var(--on-brand);flex-shrink:0}
.hd-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.wordmark{font-size:17px;font-weight:700;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{height:34px;width:auto;max-width:180px;object-fit:contain}
.hd.light{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:inset 0 -3px 0 var(--brand)}
.hd.light .logo{height:52px;max-width:200px}
.hd.light .hd-l{flex-direction:row;align-items:center;gap:14px}
.hd.light .hd-sub{color:var(--mute);opacity:1}
.hd.light .stars{color:#e8a200}
.hd.light .x{color:var(--ink)}
.hd.light .x:hover{background:var(--soft)}
.hd-sub{font-size:13px;opacity:.92;white-space:nowrap}
.tpl-note{flex-shrink:0;margin:10px 16px 0;padding:9px 12px;border-radius:10px;background:#fff4d6;color:#5c4600;font-size:12.5px;line-height:1.4}
.tpl-note a{color:inherit;font-weight:700;text-underline-offset:2px}
.edit-brand .mhead,.edit-brand .menu,.edit-brand .ft{filter:blur(3px);opacity:.35;pointer-events:none;user-select:none;transition:none}
.edit-brand .bdi{position:relative}
.next-note{position:absolute;z-index:5;left:50%;top:38%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:999px;background:#1d221c;color:#fff;font-size:13.5px;font-weight:700;white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
.stepper{display:inline-flex;width:fit-content;align-items:center;gap:6px;padding:6px;border-radius:14px;background:var(--soft,#f2f3f5);margin-top:4px}
.stepper button{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:#fff;color:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper button svg{width:18px;height:18px}
.stepper b{min-width:110px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.qtyin .inwrap{display:flex;align-items:center;gap:8px}
.qtyin input{flex:1}
.qtyin i{font-style:normal;color:var(--mute,#667085);white-space:nowrap}
.lede.small{font-size:13px;margin-top:6px}
.hd-sub .dot{margin:0 3px}
.stars{color:#ffd166;letter-spacing:1px;font-size:12px}
.x{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--on-brand);cursor:pointer;flex-shrink:0;transition:background-color .15s,transform .15s var(--ease)}
.x:hover{background:rgba(255,255,255,.16)}
.x:active{transform:scale(.92)}
.x svg{width:20px;height:20px;transition:transform .2s var(--ease)}
.x:hover svg{transform:rotate(90deg)}
/* progress bar (like Avenue's): one thin rounded track, the fill grows between steps */
.prog{display:flex;justify-content:center;padding:16px 20px 4px;flex-shrink:0}
.ptrack{width:100%;max-width:430px;height:6px;border-radius:999px;background:#e9ebee;overflow:hidden}
.ptrack i{display:block;height:100%;border-radius:inherit;background:var(--brand);transition:width .6s var(--ease)}
/* body */
.bd{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 26px 26px;scrollbar-width:thin}
.bd.in-fwd .bdi{animation:inFwd .32s var(--ease) both}
.bd.in-back .bdi{animation:inBack .32s var(--ease) both}
.bd.in-done .bdi{animation:inDone .4s var(--ease) both}
@keyframes inFwd{from{opacity:0;transform:translateY(14px)}}
@keyframes inBack{from{opacity:0;transform:translateY(-10px)}}
.bd.in-fwd .stag,.bd.in-back .stag{animation:reveal .4s var(--ease) both;animation-delay:calc(var(--i) * 40ms + 60ms)}
@keyframes inDone{from{opacity:0;transform:translateY(8px)}}
/* the old screen, fading out on top while the new one comes in */
.ghost{position:absolute;left:0;right:0;z-index:3;overflow:hidden;pointer-events:none;background:#fff;animation:ghostOut .2s var(--ease) forwards}
.ghost .bd{height:100%;overflow:hidden}
@keyframes ghostOut{to{opacity:0;transform:translateY(-6px)}}
.blk{display:flex;flex-direction:column;gap:12px}
.bdi > h3{margin-bottom:14px}
.bdi > h3 + .lede{margin:-8px 0 16px}
.blk + .blk{margin-top:24px;padding-top:22px;border-top:1px solid var(--line2);animation:reveal .35s var(--ease) both}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}}
h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;color:var(--mute);font-size:14px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:4px}
.art{width:150px;height:auto}
.meta{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--mute)}
.meta svg{width:15px;height:15px}
/* menu rows */
.menu{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .2s var(--ease),transform .15s var(--ease),background-color .15s}
.mrow:hover{border-color:color-mix(in srgb,var(--brand) 45%,#fff);background:color-mix(in srgb,var(--brand) 3%,#fff);box-shadow:var(--sh-2)}
.mrow:active{transform:scale(.985)}
.mi{display:flex;align-items:center;justify-content:center;width:42px;height:42px;flex-shrink:0;border-radius:10px;background:var(--tint);color:var(--brand);transition:background-color .2s,color .2s}
.mrow:hover .mi{background:var(--brand);color:var(--on-brand)}
.mi svg{width:22px;height:22px;stroke-width:1.8}
.mt{display:flex;flex-direction:column;flex:1;gap:1px}
.mt b{font-weight:600;font-size:15.5px}
.mt span{font-size:13.5px;color:var(--mute)}
.chev{width:18px;height:18px;color:var(--faint);transition:transform .2s var(--ease),color .15s}
.mrow:hover .chev{transform:translateX(3px);color:var(--ink)}
/* service tiles */
.tiles{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,100px));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:0;border:0;background:none;cursor:pointer;text-align:center;border-radius:12px}
.tile:focus-visible{outline-offset:4px}
.tbox{position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);overflow:hidden;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .2s var(--ease),transform .2s var(--ease)}
.tbox::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--brand);opacity:0;transition:opacity .15s}
.tile:hover .tbox{border-color:color-mix(in srgb,var(--brand) 60%,#fff);background:var(--tint);box-shadow:var(--sh-2)}
.tile:active .tbox{transform:scale(.97);transition-duration:.1s}
.tbox svg{position:relative;width:38px;height:38px;stroke-width:1.35;transition:transform .3s var(--ease)}
.tile:hover .tbox svg{transform:translateY(-4px)}
.blob{transition:transform .3s var(--ease)}
.tile:hover .blob{transform:translate(12px,-14px)}
.blob{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--tint2);transform:translate(12px,-10px)}
.tbox img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.tile:hover .tbox img{transform:scale(1.06)}
.tile.on .tbox{border-color:var(--brand)}
.tile.on .tbox::after{opacity:1}
.tick{position:absolute;top:6px;left:6px;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--on-brand);z-index:2;box-shadow:0 0 0 2px #fff}
.tile.just .tick{animation:pop .32s var(--spring) both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.tick svg{width:13px;height:13px;stroke-width:3}
.tl{font-size:13px;color:var(--mute);line-height:1.25;transition:color .15s}
.tile:hover .tl{color:var(--ink)}
.tile.on .tl{color:var(--ink);font-weight:600}
.tt{font-size:11.5px;color:var(--brand);font-weight:600;margin-top:-3px}
/* icon tiles: one clean card, icon in a soft square, label inside */
.tiles.icons{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile.it .tbox{aspect-ratio:auto;flex-direction:column;justify-content:flex-start;gap:9px;min-height:112px;padding:16px 8px 13px}
.tico{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--ink);transition:transform .3s var(--ease),background-color .2s,color .2s}
.tbox .tico svg{position:static;width:22px;height:22px;stroke-width:1.7}
.tile.it:hover .tbox svg{transform:none}
.tile.it:hover .tico{transform:translateY(-3px);background:color-mix(in srgb,var(--brand) 12%,#fff);color:var(--brand)}
.tile.it.on .tico{background:var(--brand);color:var(--on-brand)}
.tile.it .tl{color:var(--ink);font-weight:600;font-size:13.5px;line-height:1.25;padding:0 2px}
.tile.it .th{display:block;margin-top:2px;padding:0 2px;font-size:11.5px;line-height:1.3;color:var(--mute)}
.tile.it .tt{margin-top:-4px}
.tile.it .tick{left:auto;right:7px;top:7px;width:20px;height:20px}
.tile.it.on .tbox{background:var(--tint)}
/* A short list of services (4 or fewer, no photos): full-width rows with the price on the right, easier to scan than a sparse grid */
.tiles.rows{grid-template-columns:minmax(0,1fr);gap:8px}
.tiles .tile.visit{grid-column:1 / -1}
.tiles .tsep{grid-column:1 / -1;height:1px;background:#e4e4de;margin:6px 0}
.tiles.rows .tile.it .tbox{display:grid;grid-template-columns:44px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:14px;row-gap:2px;align-items:center;justify-items:start;min-height:0;padding:13px 16px;text-align:left}
.tiles.rows .tile.it .tico{grid-row:1 / 3;grid-column:1}
.tiles.rows .tile.it .tl{grid-column:2;grid-row:1;align-self:end;padding:0;font-size:14.5px}
.tiles.rows .tile.it .th{grid-column:2;grid-row:2;align-self:start;margin:0;padding:0;font-size:12.5px}
.tiles.rows .tile.it .tt{grid-column:3;grid-row:1 / 3;justify-self:end;margin:0;font-size:13px;white-space:nowrap}
.tiles.rows .tile.it .tick{display:none}
.tiles.rows .tile.it:hover .tico{transform:none}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.col{flex-direction:column;align-items:stretch}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;cursor:pointer;text-align:left;box-shadow:var(--sh-1);transition:border-color .15s,background-color .15s,box-shadow .2s var(--ease),transform .12s var(--ease)}
.chip:hover{border-color:color-mix(in srgb,var(--brand) 50%,#fff);box-shadow:var(--sh-2)}
.chip:active{transform:scale(.97)}
.chip.on{border-color:var(--brand);background:var(--tint);color:color-mix(in srgb,var(--brand) 82%,#000);box-shadow:0 0 0 1px var(--brand)}
.chip.just{animation:press .28s var(--ease)}
@keyframes press{40%{transform:scale(.96)}}
.chips.col .chip{justify-content:space-between;padding:12px 14px}
.save{padding:1px 7px;border-radius:999px;background:#e7f5ec;color:#17733d;font-size:12px;font-weight:600}
.ci{width:14px;height:14px}
.chip.just .ci{animation:pop .3s var(--spring) both}
.amt{color:var(--mute)}
.chip.on .amt{color:inherit}
/* price + truck */
.pricebox{display:flex;align-items:center;gap:18px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.pricebox.simple{margin-top:20px}
.truck{width:150px;flex-shrink:0}
.truck rect[fill="var(--brand)"]{transition:width .4s var(--ease)}
.pricebox b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pricebox span{font-size:13px;color:var(--mute)}
.alert{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.alert svg{width:18px;height:18px;flex-shrink:0}
.alert span{flex:1}
.alert a{padding:6px 12px;border-radius:8px;background:var(--warn);color:#fff;font-weight:600;text-decoration:none}
/* fields */
.fld{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}
.fld em{color:var(--warn);font-style:normal}
.fld input,.fld textarea{width:100%;min-height:46px;padding:11px 13px;border:1px solid #cdd2d7;border-radius:10px;font-size:16px;font-weight:400;background:#fff;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s}
.fld input:hover,.fld textarea:hover{border-color:#b3b9c0}
.fld textarea{resize:vertical}
.fld input::placeholder,.fld textarea::placeholder{color:#a3a9b1}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
.narrow{width:100%;max-width:380px;align-self:center}
.inwrap{position:relative}
.inwrap .ok{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ok);display:flex;animation:pop .3s var(--spring) both}
.inwrap .ok svg{width:20px;height:20px}
.inwrap .ok[hidden]{display:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fine{margin:0;font-size:12.5px;color:var(--faint)}
.warn{margin:0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;animation:reveal .25s var(--ease) both}
.warn a{color:inherit;font-weight:700}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn-out{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:1px dashed color-mix(in srgb,var(--brand) 55%,#fff);border-radius:10px;background:var(--tint);color:var(--brand);font-size:14px;font-weight:600;cursor:pointer;transition:background-color .15s,border-color .15s,transform .12s var(--ease)}
.btn-out:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 11%,#fff)}
.btn-out:active{transform:scale(.97)}
.btn-out svg{width:16px;height:16px}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line);animation:pop .3s var(--spring) both}
/* time */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--soft);border:1px solid var(--line2)}
.tabs button{padding:9px;border:0;border-radius:9px;background:transparent;font-size:14.5px;color:var(--mute);cursor:pointer;transition:background-color .2s,color .15s,box-shadow .2s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--sh-2)}
.radios{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:12px;min-height:48px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;cursor:pointer;text-align:left;box-shadow:var(--sh-1);transition:border-color .15s,background-color .15s,box-shadow .2s var(--ease),transform .12s var(--ease)}
.radio:hover{border-color:color-mix(in srgb,var(--brand) 50%,#fff);box-shadow:var(--sh-2)}
.radio:active{transform:scale(.99)}
.rb{width:18px;height:18px;border-radius:50%;border:2px solid #a2a9b1;flex-shrink:0;transition:border-width .2s var(--spring),border-color .15s}
.radio.on{border-color:var(--brand);background:var(--tint);box-shadow:0 0 0 1px var(--brand)}
.radio.on .rb{border:5px solid var(--brand)}
.radio.just .rb{animation:pop .3s var(--spring) both}
.radio:disabled{cursor:not-allowed;color:#aab0b7;background:var(--soft);box-shadow:none}
.radio:disabled:hover{border-color:var(--line)}
.full{margin-left:auto;font-size:12.5px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px;color:var(--mute);cursor:pointer;box-shadow:var(--sh-1);transition:border-color .15s,background-color .15s,transform .12s var(--ease)}
.day:hover{border-color:var(--hover-line)}
.day:active{transform:scale(.95)}
.day b{font-size:18px;color:var(--ink);font-weight:600}
.day.on{border-color:var(--brand);background:var(--brand);color:color-mix(in srgb,var(--on-brand) 85%,transparent)}
.day.on b{color:var(--on-brand)}
.day.just{animation:press .28s var(--ease)}
.day:disabled{background:var(--soft);cursor:not-allowed;box-shadow:none}
.day:disabled b{color:#b9bec5;text-decoration:line-through}
/* call */
.callbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.linkrow{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;cursor:pointer;transition:border-color .15s,box-shadow .2s}
.linkrow:hover{border-color:var(--hover-line);box-shadow:var(--sh-2)}
.linkrow svg{width:18px;height:18px;color:var(--faint)}
/* done */
.donehd{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px;text-align:center}
.okc{display:flex;align-items:center;justify-content:center;width:56px;height:56px;margin-bottom:8px;border-radius:50%;background:var(--ok);color:#fff;flex-shrink:0;animation:okIn .45s var(--spring) both;box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 14%,transparent)}
.okc svg{width:26px;height:26px}
.okc .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .4s .25s var(--ease) forwards}
@keyframes okIn{from{transform:scale(.4);opacity:0;box-shadow:0 0 0 0 transparent}}
@keyframes draw{to{stroke-dashoffset:0}}
.donehd h3{margin:0;font-size:22px}
.donehd .lede{max-width:38ch;font-size:15px}
.receipt{margin:20px 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;animation:reveal .4s .2s var(--ease) both}
.receipt .rh{display:flex;justify-content:space-between;padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.receipt .rh span:first-child{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.receipt div:not(.rh){display:flex;justify-content:space-between;gap:16px;padding:11px 14px;border-bottom:1px solid var(--line2);font-size:14px}
.receipt div:last-child{border-bottom:0}
.receipt dt{color:var(--mute)}
.receipt dd{margin:0;font-weight:600;text-align:right}
/* call: a slim row under the start options (not a tile), with the number written out */
.callrow{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;text-decoration:none;cursor:pointer;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.callrow:hover{border-color:var(--hover-line);box-shadow:var(--sh-2)}
.callrow:active{transform:scale(.99)}
.callrow .cr-ic{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--brand);flex-shrink:0}
.callrow .cr-ic svg{width:19px;height:19px;flex-shrink:0;overflow:visible}
.cr-t{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.cr-t b{font-size:15px;font-weight:600}
.cr-t small{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.cr-t .dot{margin:0 3px;color:var(--faint)}
.callrow .cr-go{width:18px;height:18px;color:var(--faint);flex-shrink:0}
.callrow.slot.off{opacity:.45}
/* same day */
.soonnote{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;border-radius:10px;background:var(--tint);color:color-mix(in srgb,var(--brand) 80%,#000);font-size:14px}
.soonnote svg{width:16px;height:16px;flex-shrink:0}
.chip.priced .amt{margin-left:auto;padding-left:10px;font-weight:600;font-variant-numeric:tabular-nums}
/* footer call link: the number on computers (they can't dial), just the icon on phones */
.callus .cu-w{display:none}
.callus .cu-n{font-variant-numeric:tabular-nums}
/* done */
.from{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--tint);border:1px solid color-mix(in srgb,var(--brand) 18%,#fff);animation:reveal .4s .15s var(--ease) both}
.from .from-ic{width:38px;height:38px;padding:9px;border-radius:50%;background:var(--brand);color:var(--on-brand);flex-shrink:0}
.from div{display:flex;flex-direction:column;gap:2px}
.from b{font-size:15px;font-weight:600;line-height:1.35}
.from .fnum{white-space:nowrap;font-variant-numeric:tabular-nums}
.from span{font-size:13px;color:var(--mute)}
.receipt .rh .rstate{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#8a5a00}
.receipt .rh .rstate::before{content:"";width:7px;height:7px;border-radius:50%;background:#e0a100}
.receipt .rh .rstate.ok{color:var(--ok)}
.receipt .rh .rstate.ok::before{background:var(--ok)}
.done-foot{justify-content:center;text-align:center}
/* start options without photos (an owner's page before they add any): the same boxes, a soft brand tint, the icon on top */
.mtile.noimg{background:color-mix(in srgb,var(--brand) 7%,#fff);box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 16%,#e1e4e8),var(--sh-1)}
.mtile.noimg{display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:14px}
.mtile.noimg .mt{position:static}
.mtile.noimg .mico{position:static;flex-shrink:0;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--on-brand)}
.mtile.noimg .mico svg{width:21px;height:21px}
.mtile.noimg .mt{color:var(--ink)}
.mtile.noimg .mt span{color:var(--mute)}
.mtile.noimg:hover{background:color-mix(in srgb,var(--brand) 11%,#fff)}
.edit-brand .callrow{filter:blur(3px);opacity:.35;pointer-events:none}
.noside .side{display:none!important}
.dimmain .main>:not(.hd){filter:blur(5px);opacity:.5;pointer-events:none;user-select:none;transition:filter .2s,opacity .2s}
.locked button,.locked a,.locked input,.locked textarea,.locked label{cursor:default!important}
.locked .mtile:hover::after{opacity:0}.locked .mtile:hover .mimg img{transform:none}.locked .mtile.noimg:hover{background:color-mix(in srgb,var(--brand) 7%,#fff)}
.pickable .mtile{cursor:pointer!important}
.pickable .mtile:hover::after{opacity:.55!important}
.mtile.sel::after{opacity:1!important;box-shadow:inset 0 0 0 3px var(--brand),0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.qs-head{margin:0 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line2)}
.qs-head span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.qs-head b{display:block;margin-top:2px;font-size:20px;letter-spacing:-.01em}
.qs-head .lede{margin-top:4px}
/* footer */
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 26px;border-top:1px solid var(--line2);background:#fff;flex-shrink:0}
.callus{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;margin-left:-10px;border-radius:10px;color:var(--brand);font-weight:600;text-decoration:none;font-size:15px;transition:background-color .15s}
.callus:hover{background:var(--tint)}
.callus svg{width:17px;height:17px}
.ft-r{display:flex;gap:10px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border:0;border-radius:12px;background:var(--brand);color:var(--on-brand);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 1px 2px rgba(16,24,40,.12),inset 0 1px 0 rgba(255,255,255,.14);transition:filter .15s,transform .12s var(--ease),opacity .2s,box-shadow .2s}
.btn svg{width:17px;height:17px}
.btn .arr{transition:transform .2s var(--ease)}
.btn:hover{filter:brightness(.93);box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 32%,transparent)}
.btn:hover .arr{transform:translateX(3px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
.btn.busy{opacity:.85}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-g{height:46px;padding:0 18px;border:0;border-radius:12px;background:#eef0f2;font-size:15px;font-weight:500;cursor:pointer;transition:background-color .15s,transform .12s var(--ease)}
.btn-g:hover{background:#e3e6e9}
.btn-g:active{transform:scale(.97)}
.pow{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 0 10px;font-size:11.5px;color:var(--faint);flex-shrink:0;background:#fff}
.pow a{color:inherit;text-decoration:none}
.pow a:hover{color:var(--mute)}
.demo{padding:1px 7px;border-radius:999px;background:#fff4d6;color:#8a5a00;font-weight:600}
.err{padding:40px;text-align:center;color:var(--mute)}
/* ---- layout: brand panel (wide) + main column ---- */
.card{flex-direction:row;container-type:inline-size;container-name:card}
.main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.side{display:none}
/* first screen: photo tiles with the label on the photo */
.mhead{margin-bottom:16px}
.mhead h3{margin:0}
.mhead .lede{margin-top:3px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtrust{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:16px 2px 0;font-size:13.5px;color:var(--mute);font-weight:500}
.mtrust .sopen{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--ink,#1a1d21)}
.mtrust .sopen i{width:8px;height:8px;border-radius:50%;background:#9aa1a9}
.mtrust .sopen.on i{background:#1f8a4c;box-shadow:0 0 0 3px rgba(31,138,76,.18)}
/* Owners can hide start options: 3 left = the last one runs full width, 1 or 2 = full-width rows */
.tiles2.n3 .mtile:last-child,.tiles2.n2 .mtile,.tiles2.n1 .mtile{grid-column:1/-1;aspect-ratio:auto;height:150px}
.mtile{position:relative;display:block;aspect-ratio:4/3.1;padding:0;border:0;border-radius:16px;overflow:hidden;background:#20252b;text-align:left;cursor:pointer;box-shadow:0 0 0 1px rgba(16,24,40,.06),var(--sh-1);transition:box-shadow .2s var(--ease),transform .15s var(--ease)}
.mimg{position:absolute;inset:0}
.mimg img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.mimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,14,0) 30%,rgba(10,12,14,.55) 62%,rgba(10,12,14,.86) 100%);transition:opacity .2s}
.mtile .mt{position:absolute;left:12px;right:12px;bottom:11px;z-index:1;display:flex;flex-direction:column;gap:2px;color:#fff}
.mtile .mt b{font-size:15px;letter-spacing:-.01em}
.mtile .mt span{font-size:12px;line-height:1.3;color:rgba(255,255,255,.82)}
.mtile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--brand);opacity:0;transition:opacity .15s}
.mtile:hover{box-shadow:0 0 0 1px rgba(16,24,40,.06),var(--sh-2)}
.mtile:hover::after{opacity:1}
.mtile:hover .mimg img{transform:scale(1.06)}
.mtile:active{transform:scale(.98)}
.bd.in-fwd .mtile.stag,.bd.in-back .mtile.stag{animation:reveal .4s var(--ease) both;animation-delay:calc(var(--i) * 50ms + 60ms)}
@container card (min-width: 760px){
  .mtrust{display:none}
  .side{position:relative;display:flex;width:33%;flex-shrink:0;overflow:hidden}
  .sb{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;background:var(--brand)}
  .sb > img{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}
  .sb::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,var(--brand) 0%,var(--brand) 26%,color-mix(in srgb,var(--brand) 60%,transparent) 52%,rgba(10,12,14,.15) 70%,rgba(10,12,14,.7) 100%)}
  .st{position:relative;z-index:2;display:flex;flex-direction:column;gap:22px;padding:30px 28px;color:var(--on-brand)}
  .sname{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;letter-spacing:-.005em}
  .smark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--on-brand);color:var(--brand);font-size:15px;font-weight:800;flex-shrink:0}
  .slogo{align-self:flex-start;padding:8px 10px;border-radius:10px;background:#fff}
  .slogo img{display:block;height:34px;width:auto;max-width:150px;object-fit:contain}
  .scopy{display:flex;flex-direction:column;gap:10px}
  .scopy.swap h2{animation:sideIn .5s var(--ease) both}
  .scopy.swap p{animation:sideIn .5s .07s var(--ease) both}
  @keyframes sideIn{from{opacity:0;transform:translateY(10px)}}
  .st h2{margin:0;font-size:28px;font-weight:700;line-height:1.14;letter-spacing:-.025em;text-wrap:pretty}
  .st p{margin:0;max-width:30ch;font-size:15px;line-height:1.5;opacity:.86;font-weight:500}
  .sinfo{position:relative;z-index:2;display:flex;flex-direction:column;gap:7px;margin:18px;padding:14px 15px;border-radius:14px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;color:#3a4048;box-shadow:0 10px 30px -12px rgba(0,0,0,.4)}
  .sinfo b{color:#1a1d21}
  .sinfo .stars{color:#e8a200}
  .sopen{display:flex;align-items:center;gap:7px;font-weight:700;color:#1a1d21}
  .sopen i{width:8px;height:8px;border-radius:50%;background:#9aa1a9}
  .sopen.on i{background:#1f8a4c;box-shadow:0 0 0 3px rgba(31,138,76,.18)}
  .main{background:#fff}
  .main > .hd{position:absolute;top:12px;right:12px;z-index:5;padding:0;background:transparent;border:0;box-shadow:none}
  .main > .hd .hd-l{display:none}
  .main > .hd .x{color:var(--ink);background:#f1f2f4}
  .main > .hd .x:hover{background:#e4e6e9}
  .prog{padding:28px 64px 6px}
  .bd{padding:26px 40px 24px}
  .bdi{max-width:540px;margin:0 auto}
  .mhead{margin:14px 0 18px}
  .mhead h3{font-size:24px}
  .tiles2{gap:14px}
  .mtile .mt{left:14px;right:14px;bottom:13px}
  .mtile .mt b{font-size:16.5px}
  .ft{padding:14px 40px}
}
@media (hover:none){.tile.it:hover .tico{transform:none;background:var(--soft);color:var(--ink)}.tile.it.on:hover .tico{background:var(--brand);color:var(--on-brand)}.tile:hover .tbox{background:#fff;border-color:var(--line)}.tile:hover .tbox img,.tile:hover .tbox svg{transform:none}.tile.on .tbox{border-color:var(--brand)}.mrow:hover .chev{transform:none}.mrow:hover .mi{background:var(--tint);color:var(--brand)}}
@media (max-width:560px){
  .page{padding:0}
  .hostline{display:none}
  .card{max-width:none;height:100dvh;min-height:0;border-radius:0;box-shadow:none;animation:none}
  .bd{padding:18px 16px 22px}
  .ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  body.embed .ft{padding-bottom:12px}
  .ft-r{flex:1;justify-content:flex-end}
  .btn{flex:1;max-width:240px}
  .f2{grid-template-columns:1fr}
  .pricebox{flex-direction:column;align-items:flex-start;gap:10px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .tbox svg{width:32px;height:32px}
  .tile.it .tbox{min-height:104px;padding:14px 6px 12px}
  .tile.it .tl{font-size:12.5px}
  .callus{font-size:0;gap:0;width:46px;height:46px;justify-content:center;margin-left:0;border:1px solid var(--line);border-radius:12px}
  .callus svg{width:19px;height:19px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.okc .draw{stroke-dashoffset:0}}

/* Page builder (?builder=1&edit=1): the template's slots, outlined like an equipment slot in a game */
.slot{position:relative;cursor:pointer;font:inherit;transition:box-shadow .18s var(--ease),transform .18s var(--ease),background-color .18s}
button.slot{border:0}
.slot:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.slot-logo{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:150px;height:52px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);color:#fff;font-size:13px;font-weight:700;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 6px,transparent 6px 12px)}
.hd.light .slot-logo{background-color:#f6f7f9;box-shadow:inset 0 0 0 2px #c7ccd4;color:var(--ink)}
.slot-logo.has{padding:4px 8px;background:none;box-shadow:inset 0 0 0 2px transparent}
.slot-logo:hover{box-shadow:inset 0 0 0 2px var(--brand),0 0 0 4px rgba(0,0,0,.06);transform:translateY(-1px)}
.hd:not(.light) .slot-logo:hover{box-shadow:inset 0 0 0 2px #fff,0 0 0 4px rgba(255,255,255,.18)}
.sl-plus{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:currentColor;font-size:15px;font-weight:800;line-height:1}
.sl-plus{color:inherit}.slot .sl-plus{background:rgba(127,127,127,.18)}
.sl-tip{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);padding:2px 8px;border-radius:6px;background:#111;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.slot:hover .sl-tip{opacity:1}
.slot-rate{display:inline-flex;align-items:center;gap:6px;margin-left:6px;padding:3px 9px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1.5px currentColor;color:inherit;font-size:12px;font-weight:700;opacity:.85;border:0}
.slot-rate:hover{opacity:1;transform:translateY(-1px)}
.slot-rate .sl-plus{width:16px;height:16px;font-size:12px}
.slot-side{position:absolute;inset:14px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:16px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);color:#fff;font-size:14px;font-weight:700;opacity:0;text-align:center;backdrop-filter:blur(1px)}
.slot-side small{font-size:11.5px;font-weight:600;opacity:.85}
.slot-side .sl-plus{width:34px;height:34px;font-size:22px;background:rgba(255,255,255,.25)}
.side:hover .slot-side,.slot-side:focus-visible{opacity:1}
html.editing .side .sb::after{content:"";position:absolute;inset:14px;border-radius:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);pointer-events:none}
.slot-tile{outline:none}
.slot-tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,.0);transition:box-shadow .18s}
.slot-tile:hover::after{box-shadow:inset 0 0 0 3px var(--brand),0 0 0 4px rgba(0,0,0,.05)}
.slot-tile:hover{transform:translateY(-2px)}
.slot-tile.off{opacity:.45;filter:grayscale(1)}
.slot-tile.off::after{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);border:2px dashed rgba(0,0,0,.25)}
.slot-tile.dragging{opacity:.4}
.slot-tile.over::after{box-shadow:inset 0 0 0 3px var(--brand),0 0 0 6px rgba(0,0,0,.08)}
.sl-drag{position:absolute;top:8px;left:8px;z-index:2;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;letter-spacing:-2px;cursor:grab}
.sl-edit{position:absolute;top:8px;right:8px;z-index:2;padding:3px 9px;border-radius:999px;background:#fff;color:#111;font-size:11.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2)}

.slot-slogo{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;max-width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);color:#fff;text-align:left;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px);border:0}
.slot-slogo b{display:block;font-size:14px}
.slot-slogo small{display:block;font-size:11.5px;font-weight:600;opacity:.8}
.slot-slogo .sl-plus{flex:none;width:26px;height:26px;font-size:18px;background:rgba(255,255,255,.25)}
.slot-slogo.has{padding:8px 10px;background:#fff;background-image:none;box-shadow:inset 0 0 0 2px transparent}
.slot-slogo.has img{display:block;max-height:44px;max-width:180px;object-fit:contain}
.slot-slogo:hover{box-shadow:inset 0 0 0 2px #fff,0 0 0 5px rgba(255,255,255,.18);transform:translateY(-1px)}
.slot-slogo.has:hover{box-shadow:inset 0 0 0 2px var(--brand),0 0 0 5px rgba(255,255,255,.25)}
.slot-srate{display:flex;align-items:center;gap:6px;width:100%;margin-top:2px;padding:8px 10px;border-radius:10px;background:var(--soft,#f3f4f6);box-shadow:inset 0 0 0 1.5px #c7ccd4;font-size:13px;font-weight:700;color:inherit;text-align:left;border:0}
.slot-srate .sl-plus{width:18px;height:18px;font-size:13px}
.slot-srate:hover{box-shadow:inset 0 0 0 2px var(--brand);transform:translateY(-1px)}
.sl-badge{position:absolute;top:52%;left:50%;transform:translateX(-50%);z-index:1;white-space:nowrap;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#111;font-size:11.5px;font-weight:700;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.side:hover .sl-badge{opacity:0}

/* Logos sized by shape (fitLogos): wide wordmarks lower, square badges bigger, so every logo reads at the same weight */
.slogo img[data-shape="wide"],.slot-slogo img[data-shape="wide"]{height:30px;max-width:190px}
.slogo img[data-shape="mid"],.slot-slogo img[data-shape="mid"]{height:40px;max-width:170px}
.slogo img[data-shape="square"],.slot-slogo img[data-shape="square"]{height:58px;width:58px;max-width:58px}
